    <text style="font-size: 9px; font-family: 'Times New Roman'" transform="translate(162.389531 414.353475)">The legacy search syntax and initial database hit counts could not be reconstructed. This diagram is therefore a</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'" transform="translate(150.291563 423.799819)">PRISMA-inspired accounting of retained project inventories, not a claim of PRISMA-complete systematic searching.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Times New Roman'; text-anchor: middle" x="361.744453" y="466.781316" transform="rotate(-0 361.744453 466.781316)">* ESR_Singh2025_084 has both a verified-full-text row and a later exclusion-decision row.  The full paper-level ledger and all 70-to-57 decisions are provided in Supplementary Table S7.</text>
   </g>
